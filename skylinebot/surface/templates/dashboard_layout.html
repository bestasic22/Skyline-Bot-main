<body class="min-h-screen overflow-x-hidden page-{{PAGE_MODE}} ui-pro dashboard-boot-loading">

  {{I18N_SCRIPT_TAGS}}
  <script src="/dashboard/static/dashboard/layout-runtime.js?v=20260521-14" defer></script>
  <script src="/dashboard/static/dashboard/layout-unified.js?v=20260520-3" defer></script>
  <script>
    (() => {
      const loaded = new Set();
      const loadScript = (src) => {
        if (loaded.has(src)) return Promise.resolve();
        loaded.add(src);
        return new Promise((resolve, reject) => {
          const existing = document.querySelector(`script[src="${src.replace(/"/g, '\\"')}"]`);
          if (existing) {
            resolve();
            return;
          }
          const script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(`load-failed:${src}`));
          document.head.appendChild(script);
        });
      };
      const onIdle = (callback, timeout = 1600) => {
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(callback, { timeout });
        } else {
          window.setTimeout(callback, Math.min(timeout, 1000));
        }
      };
      const hasImageTarget = () => Boolean(document.querySelector(
        "form input[name*='image'], form input[id*='image'], form input[name*='thumb'], form input[id*='thumb'], form input[name*='avatar'], form input[id*='avatar'], form input[name*='banner'], form input[id*='banner'], form input[name*='icon'], form input[id*='icon']"
      ));
      const hasEmojiTarget = () => Boolean(document.querySelector(
        "input[name*='emoji'], input[id*='emoji'], textarea[name*='emoji'], input[name*='symbol'], input[id*='symbol'], textarea[name*='symbol'], input[name*='reaction'], input[id*='reaction'], textarea[name*='reaction'], input[name*='badge'], input[id*='badge'], textarea[name*='badge'], .econ-emoji-picker, .sb-emoji-picker, [data-emoji-picker], [data-emoji]"
      ));
      const hasDiscordEmojiText = () => {
        const text = document.body ? String(document.body.textContent || "") : "";
        return /<a?:[A-Za-z0-9_]{2,32}:[0-9]{5,22}>/.test(text);
      };
      const loadEnhancements = () => {
        if (hasImageTarget()) {
          loadScript("/dashboard/static/dashboard/image-assist.js?v=20260522-1").catch(() => {});
        }
        if (hasEmojiTarget()) {
          loadScript("/dashboard/static/dashboard/emoji-picker-global.js?v=20260522-1").catch(() => {});
        }
        if (hasDiscordEmojiText()) {
          loadScript("/dashboard/static/dashboard/discord-emoji-renderer.js?v=20260522-1").catch(() => {});
        }
      };
      onIdle(loadEnhancements);
      document.addEventListener("focusin", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.matches("input[name*='emoji'], input[id*='emoji'], textarea[name*='emoji'], input[name*='symbol'], input[id*='symbol'], textarea[name*='symbol'], input[name*='reaction'], input[id*='reaction'], textarea[name*='reaction'], input[name*='badge'], input[id*='badge'], textarea[name*='badge']")) {
          loadScript("/dashboard/static/dashboard/emoji-picker-global.js?v=20260522-1").catch(() => {});
        }
        if (target.matches("input[name*='image'], input[id*='image'], input[name*='thumb'], input[id*='thumb'], input[name*='avatar'], input[id*='avatar'], input[name*='banner'], input[id*='banner'], input[name*='icon'], input[id*='icon']")) {
          loadScript("/dashboard/static/dashboard/image-assist.js?v=20260522-1").catch(() => {});
        }
      }, true);
    })();
  </script>
