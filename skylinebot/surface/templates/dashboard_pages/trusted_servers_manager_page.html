
        <section class="panel" style="max-width:980px; margin:0 auto; display:grid; gap:14px;">
          <h1>Manage Trusted Servers</h1>
          <p class="muted">Drag and drop to reorder trusted servers, then save.</p>
          {notice_markup}
          <form method="post" action="/dashboard/admin/trusted-servers" id="trustedOrderForm">
            <input type="hidden" name="trusted_server_order" id="trustedOrderInput" value="{_escape(', '.join(ordered))}">
            <ul id="trustedOrderList" style="list-style:none; margin:0; padding:0; display:grid; gap:8px;">
              {list_items}
            </ul>
            <div class="auth-actions" style="justify-content:flex-start; margin-top:14px;">
              <button class="primary-btn" type="submit">Save Order</button>
              <a class="ghost-btn" href="/dashboard">Back to Dashboard</a>
            </div>
          </form>
        </section>
