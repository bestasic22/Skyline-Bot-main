
    <section class="section-stack dashboard-detail-shell page-giveaways-shell">
      <section class="panel">
        <div class="panel-header detail-page-hero detail-page-hero-giveaways">
          <div class="panel-title detail-page-hero-copy">
        <h1 data-i18n="tab_giveaways" data-icon-key="giveaways">กิจกรรมแจกของ (Giveaways)</h1>
      <p class="muted">ตั้งค่าสิทธิ์และค่าเริ่มต้นกิจกรรมแจกของ พร้อมสร้างกิจกรรมได้จากหน้านี้</p>
          </div>
        </div>
        <form method="post" action="/dashboard/guild/{current_guild['id']}/giveaways" style="margin-top:18px;">
          <div class="field-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;">
            <label>บทบาทที่อนุญาตให้จัดการ Giveaway
              {_render_role_select("required_role_id", bot_guild, permissions.get("required_role_id"), placeholder="เลือก...") if bot_guild else f'<input type="text" name="required_role_id" value="{_escape(permissions.get("required_role_id", ""))}" placeholder="Role ID">'}
            </label>
            <label>ห้องกิจกรรม (ค่าเริ่มต้น)
              {_render_channel_select("default_channel_id", bot_guild, default_channel_id, placeholder="เลือกช่อง")}
            </label>
            <label>ระยะเวลากิจกรรม (เช่น 1h, 1d2h)
              <input type="text" name="default_duration" value="{_escape(default_duration)}" placeholder="1h">
            </label>
            <label>จำนวนผู้ชนะ
              <input type="number" name="default_winners" min="1" max="50" value="{default_winners}">
            </label>
            <label>รางวัล (ค่าเริ่มต้น)
              <input type="text" name="default_prize" value="{_escape(default_prize)}" placeholder="เช่น Nitro 1 เดือน">
            </label>
            <label>สี Embed
              <input type="color" name="embed_color" value="{_escape(embed_color)}">
            </label>
            <label style="grid-column:1/-1;">หัวข้อ Embed
              <input type="text" name="embed_title" maxlength="120" value="{_escape(embed_title)}" placeholder="กิจกรรมแจกของ">
            </label>
            <label style="grid-column:1/-1;">คำอธิบาย Embed
              <textarea name="embed_description" style="min-height:100px;" placeholder="รายละเอียดกิจกรรม...">{_escape(embed_description)}</textarea>
            </label>
          </div>
          <button class="save-btn" type="submit">บันทึกสิทธิ์และค่าเริ่มต้นกิจกรรมแจกของ</button>
        </form>

        <div class="panel-sub detail-page-section" style="margin-top:16px;">
          <strong>ตัวอย่าง Embed</strong>
          <div style="margin-top:10px; border-left:4px solid {_escape(embed_color)}; background:rgba(255,255,255,.03); border-radius:8px; padding:12px;">
            <div style="font-weight:700; margin-bottom:6px;">{_escape(embed_title)}</div>
            <div class="muted">{_escape(embed_description)}</div>
          </div>
        </div>

        <form method="post" action="/dashboard/guild/{current_guild['id']}/giveaways/create" style="margin-top:18px;">
          <h2 style="margin:0 0 8px 0;" data-icon-key="giveaways">สร้างกิจกรรมแจกของทันที</h2>
          <div class="field-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;">
            <label>ห้อง
              {_render_channel_select("channel_id", bot_guild, default_channel_id, placeholder="เลือกช่อง")}
            </label>
            <label>ระยะเวลา
              <input type="text" name="duration" value="{_escape(default_duration)}" placeholder="1h หรือ 1d2h">
            </label>
            <label>จำนวนผู้ชนะ
              <input type="number" name="winner_limit" min="1" max="50" value="{default_winners}">
            </label>
            <label style="grid-column:1/-1;">รางวัล
              <input type="text" name="prize" value="{_escape(default_prize)}" placeholder="รางวัล">
            </label>
          </div>
          <button class="primary-btn" type="submit" style="margin-top:10px;">สร้าง Giveaway จากหน้าเว็บ</button>
        </form>
      </section>
      {chart}
    </section>
